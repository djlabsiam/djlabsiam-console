<style>

    --bg: #F4F2EC;
    --surface: #FFFFFF;
    --surface2: #ECE9E0;
    --black: #111111;
    --red: #CC001A;
    --text: #111111;

    --line: #D9D5CA;

    --ok: #17692E;

  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 "Noto Sans Thai", "Segoe UI", -apple-system, system-ui, sans-serif; min-height: 100vh; min-height: 100dvh; }
  button, input, select, textarea { font: inherit; color: inherit; }
  .top { position: sticky; top: 0; z-index: 20; background: var(--black); color: #fff; border-bottom: 3px solid var(--red); padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top)); display: flex; align-items: center; gap: 12px; }
  .top .logo { font-weight: 800; letter-spacing: .5px; }
  .top .logo b { background: var(--red); padding: 2px 8px; margin-right: 8px; }
  .top .who { margin-left: auto; font-size: 14px; text-align: right; overflow-wrap: anywhere; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 16px 16px 48px; }
  .btn { min-height: 44px; padding: 0 16px; border: 1px solid var(--line-strong); background: var(--surface); font-weight: 600; cursor: pointer; border-radius: 0; }
  .btn:disabled { color: #6E6B64; background: var(--surface2); cursor: not-allowed; }
  .btn-primary { background: var(--black); color: #fff; }
  .btn-primary:disabled { color: #fff; background: #6E6B64; }
  .btn-danger { border-color: var(--red); color: var(--red); }
  .btn-sm { min-height: 44px; padding: 0 12px; font-size: 14px; }
  .btn-ghost { border-color: transparent; background: transparent; color: inherit; }
  .top .btn { background: transparent; color: #fff; border-color: #fff; }
  .field { margin-bottom: 12px; }
  .lbl { display: block; font-weight: 600; margin-bottom: 4px; font-size: 14px; }
  .input { width: 100%; min-height: 44px; padding: 8px 10px; border: 1px solid var(--line-strong); background: var(--surface); font-size: 16px; border-radius: 0; }
  textarea.input { min-height: 96px; }
  .chk { display: flex; align-items: center; gap: 10px; min-height: 44px; font-weight: 600; font-size: 16px; }
  .chk input { width: 22px; height: 22px; flex: none; }
  .hint { font-size: 14px; color: var(--text2); margin-top: 4px; }
  .wk-red { color: var(--red); font-weight: 700; }
  .alert { padding: 10px 14px; border: 1px solid var(--line-strong); background: var(--surface); margin-bottom: 14px; font-size: 14px; overflow-wrap: anywhere; }
  .alert-red { border-color: var(--red); }
  .alert-warn { background: var(--warn-soft); }

  .tabs { display: flex; gap: 0; margin-bottom: 14px; border: 1px solid var(--line-strong); background: var(--surface); }
  .tabs button { flex: 1; min-height: 44px; border: 0; background: var(--surface); font-weight: 700; cursor: pointer; }
  .tabs button + button { border-left: 1px solid var(--line-strong); }
  .tabs button[aria-selected="true"] { background: var(--black); color: #fff; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; align-items: center; }
  .bar .grow { flex: 1 1 200px; }
  .card { background: var(--surface); border: 1px solid var(--line); padding: 12px 14px; margin-bottom: 10px; overflow-wrap: anywhere; }
  .card.click { cursor: pointer; }
  .card.click:hover { background: #FBFAF6; }
  .card:focus-visible { outline: 2px solid var(--black); outline-offset: 1px; }
  .name { font-size: 17px; font-weight: 700; }
  .sub { font-size: 14px; color: var(--text2); }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  .st { display: inline-block; font-size: 14px; font-weight: 600; padding: 0 8px; border: 1px solid var(--line-strong); background: var(--surface); }
  .st-ok { border-color: var(--ok); color: var(--ok); }
  .st-warn { background: var(--warn-soft); }
  .grp { margin: 18px 0 8px; font-size: 16px; font-weight: 800; border-bottom: 2px solid var(--black); padding-bottom: 4px; }
  .grp .n { font-weight: 600; color: var(--text2); font-size: 14px; }
  .prog { display: inline-block; width: 64px; height: 10px; border: 1px solid var(--black); background: var(--surface); vertical-align: middle; }
  .prog i { display: block; height: 100%; background: var(--black); }

  .dl dt { color: var(--text2); }
  .dl dd { margin: 0; overflow-wrap: anywhere; }
  .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .form { border: 1px solid var(--line-strong); background: var(--surface2); padding: 12px; margin-top: 10px; }
  .form h3 { margin: 0 0 10px; font-size: 16px; }
  .note { margin-top: 8px; padding: 8px 10px; border-left: 3px solid var(--black); background: var(--surface2); white-space: pre-wrap; }
  .empty { padding: 18px 0; color: var(--text2); text-align: center; }
  .login { max-width: 420px; margin: 40px auto; background: var(--surface); border: 1px solid var(--line-strong); padding: 20px; }
  .login h1 { font-size: 20px; margin: 0 0 12px; }
  .back { margin-bottom: 12px; }
  @media (max-width: 520px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (prefers-reduced-motion: no-preference) { .card { transition: background .15s; } }

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ===========================================================================
// หน้าครู (P1b · migration 047) — สำหรับครูที่ "ไม่มีแถวใน admins" (เช่น Alldayz · Maniac) เข้าคอนโซลร้านไม่ได้ แต่ต้องดูนักเรียน/รอบเรียนของตัวเอง
//   ใช้บัญชี login เดิม (session ชุดเดียวกับ desk.html) · ครูคนไหนก็ได้ที่ my_teacher_id() ไม่ว่าง ใช้หน้านี้ได้ (รวม Tibass/Nutty ที่เป็นพนักงานด้วย)
//   สิทธิ์ตัวจริงอยู่ที่ฐาน (RLS + ฟังก์ชัน security definer ของ 047) — หน้านี้ "ไม่ดึง" และ "ไม่วาด" ส่วนที่ไม่ใช่ของครู:
//     ไม่มี ยอดชำระ/ราคาที่ตกลง/สลิป · ไม่มีลูกค้า/สมาชิก/บิล/สต็อก/นักเรียนของครูคนอื่น · ไม่มีอีเมล/ที่อยู่
//     เบอร์โทรของนักเรียนผู้ใหญ่แสดงเต็ม (เจ้าของตัดสิน 12 ต.ค. 69 ตามมติ 7 ต.ค.) · ผู้เยาว์ = ผู้ปกครองแทน (ฟังก์ชันฐานไม่คืนช่องทางของเด็ก)
//     ไม่มี ปิดคอร์ส/ขยายอายุเอง/แก้ราคา/แก้ข้อมูลการลงเรียน — ขอขยายอายุได้ทางคำขอ (เจ้าของตัดสิน) เท่านั้น
//   เพิ่ม 14 ต.ค. 69 (เจ้าของสั่ง · migration 060 + gcal): ครูค้นนักเรียนด้วยเบอร์เต็ม → ลงเรียนให้ตัวเอง (ราคา = ราคาตั้งของคอร์ส อ่านอย่างเดียว ฐานบังคับ) ·
//     นัดรอบได้เมื่อเจ้าของ/ผู้ดูแลบันทึกชำระครบแล้ว (ฐานบล็อก — ข้อความไทยจากฐาน) · ผูก/ถอดนัดปฏิทิน Google ของรอบตัวเอง (gcal คืนเฉพาะนัดที่ชื่อครูตรงตัวเอง)
//     ไม่มี: ช่องราคา/บันทึกชำระ/สร้างลูกค้าใหม่ — ถ้าไม่พบนักเรียนให้ทีมงานสร้างลูกค้าก่อน
//   เพิ่ม 14 ต.ค. 69 (เจ้าของสั่ง "ให้ครูเพิ่ม ลงเรียน/ย้อนหลัง ได้" · migration 062): สวิตช์ "นักเรียนเรียนไปแล้ว" ในฟอร์มเพิ่มนักเรียน —
//     วันเริ่มเรียน · ติ๊กชำระครบ (ไม่ทราบวันที่) · วันที่เรียนไปแล้ว (ไม่เกินวันนี้ · ไม่เกินจำนวนครั้งของคอร์ส) · ลงให้ตัวเองเป็นครูเท่านั้น ·
//     ไม่มีช่องราคา (ครูไม่รู้ราคาจริงของนักเรียนเก่า → ราคาที่ตกลงว่างไว้ ให้เจ้าของ/ผู้ดูแลกรอกภายหลัง) · พนักงานที่เป็นครู (Tibass/Nutty/Zlex) ฐานยังปฏิเสธ — ใช้คอนโซลผ่านผู้ดูแล
//   เพิ่ม 14 ต.ค. 69 (เจ้าของสั่ง "นัดสอนที่เดียว" · Edge Function gcal-sync + migration 063): เลือกห้องตอนนัดรอบ → ตรวจห้องชนกับปฏิทิน → นัดในฐาน → ลง Google Calendar ให้เอง ·
//     ยกเลิก/ไม่มา → ลบ event ตาม · ล้มกลางทาง = แถบแดง + ปุ่ม "ลงปฏิทิน"/"ลบนัดในปฏิทิน" · ฟังก์ชันยังไม่ติดตั้ง/ยังไม่ตั้ง secret = ลงฐานอย่างเดียวตามเดิม (ปุ่ม "ผูกนัดปฏิทิน" เดิมยังอยู่ สำหรับนัดที่ลงจาก Discord)
//   อ่านผ่าน: rpc my_teacher_id · rpc teach_my_students · class_sessions · session_notes · enrollment_extension_requests · teachers (ชื่อตัวเอง)
//     + (เฉพาะตอนเปิดฟอร์มเพิ่มนักเรียน) courses · course_teachers + rpc teach_student_find + Edge Function gcal (เฉพาะตอนผูกนัด)
//   เขียนผ่าน: teach_session_done · teach_session_cancel · teach_session_schedule · teach_note_save · teach_extend_request · teach_enroll_create · teach_session_backfill (062) · teach_gcal_link · teach_gcal_unlink
// ⚠️ ข้อความจากผู้ใช้/ฐาน (ชื่อ · ชื่อเล่น · LINE · IG · ผู้ปกครอง · เหตุผล · บันทึกการสอน) = escapeHtml เสมอ · ห้าม console.log ข้อมูลนักเรียน
// ⚠️ ออกจากระบบ/สลับบัญชี → reset() ล้างข้อมูลทั้งหมด · ผลโหลดที่มาช้าถูกทิ้ง (uid + tok)
// ⚠️ ตัวแปรฐานข้อมูลชื่อ db เท่านั้น (ห้ามชื่อ supabase)
// ===========================================================================
function showFatalError(msg) {
  let box = document.getElementById('fatalError');
  if (!box) {
    box = document.createElement('div');
    box.id = 'fatalError';
    box.setAttribute('role', 'alert');
    box.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:99999;background:#CC001A;color:#fff;font:15px/1.5 sans-serif;padding:12px 40px 12px 16px;white-space:pre-wrap;word-break:break-word;max-height:45vh;overflow:auto;';
    const close = document.createElement('button');
    close.textContent = '✕';
    close.setAttribute('aria-label', 'ปิดข้อความ');
    close.style.cssText = 'position:absolute;top:6px;right:8px;background:transparent;border:none;color:#fff;font-size:19px;padding:4px 8px;cursor:pointer;';
    close.addEventListener('click', () => box.remove());
    box.appendChild(close);
    document.body.appendChild(box);
  }
  let t = box.querySelector('.msg');
  if (!t) { t = document.createElement('div'); t.className = 'msg'; box.appendChild(t); }
  t.textContent = msg;
}
window.addEventListener('error', e => showFatalError('เกิดข้อผิดพลาดในหน้านี้: ' + e.message));
window.addEventListener('unhandledrejection', e => showFatalError('เกิดข้อผิดพลาด: ' + ((e.reason && e.reason.message) || e.reason)));

const SUPABASE_URL = 'https://vvtefgjseihadsmvuntd.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ2dGVmZ2pzZWloYWRzbXZ1bnRkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2OTM5ODUsImV4cCI6MjEwMTI2OTk4NX0.tgRD7_5hZuUG4zvajnIbe-tuNPNqELURSHIYtnh-MyM';
if (!window.supabase || !window.supabase.createClient) {
  showFatalError('โหลดไลบรารีระบบไม่สำเร็จ — ตรวจอินเทอร์เน็ตแล้วรีเฟรชหน้า');
  throw new Error('supabase-js not loaded');
}
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const NO_TABLE = /does not exist|schema cache|Could not find the function|PGRST20[24]|42P01|42883/i;
const SOON_DAYS = 14, WEEK_DAYS = 7, LATE_DAYS = 3, GCAL_NEAR_MIN = 30;
const STATE_TXT = { waiting_payment: 'รอชำระ', queued: 'รอคิว', active: 'กำลังเรียน', expired: 'หมดอายุ', completed: 'จบ (ใช้สิทธิ์ครบ)', closed: 'ปิดแล้ว' };
const BY_TXT = { student: 'นักเรียน', teacher: 'ครู', shop: 'ร้าน' };
const KIND_TXT = { line: 'LINE', ig: 'Instagram', phone: 'โทรศัพท์' };
const WARN_TXT = {
  over_sessions: 'นัดรอบนี้เกินจำนวนครั้งของคอร์ส (ใช้สิทธิ์ + นัดไว้ครบแล้ว) — ระบบบันทึกนัดให้แล้ว ตรวจดูว่าถูกต้อง',
  after_expiry: 'วันที่นัดอยู่หลังวันหมดอายุของคอร์ส — ระบบบันทึกนัดให้แล้ว หากต้องการเรียนต่อให้ขอขยายอายุ',
};

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const todayBkk = () => new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Bangkok' });
const ymdOf = iso => new Date(iso).toLocaleDateString('en-CA', { timeZone: 'Asia/Bangkok' });
const hmOf = iso => new Date(iso).toLocaleTimeString('en-GB', { timeZone: 'Asia/Bangkok', hour: '2-digit', minute: '2-digit', hour12: false });
const fmtDate = ymd => { const d = new Date(String(ymd).slice(0, 10) + 'T12:00:00+07:00'); return isNaN(d) ? '-' : d.toLocaleDateString('th-TH', { timeZone: 'Asia/Bangkok', day: 'numeric', month: 'short', year: '2-digit' }); };
const whenOf = iso => { const d = new Date(iso); return isNaN(d) ? '-' : d.toLocaleString('th-TH', { timeZone: 'Asia/Bangkok', weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false }); };
function daysTo(ymd) {
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(ymd || ''));
  if (!m) return null;
  const t = todayBkk().split('-').map(Number);
  return Math.round((Date.UTC(+m[1], +m[2] - 1, +m[3]) - Date.UTC(t[0], t[1] - 1, t[2])) / 86400000);
}
const num = v => { const s = String(v == null ? '' : v).replace(/[,\s]/g, ''); if (s === '') return null; const n = Number(s); return Number.isFinite(n) ? n : NaN; };
function errText(e) {
  const m = String((e && e.message) || '');
  if (/[ก-๙]/.test(m)) return m;                                                       // ข้อความไทยของฟังก์ชันฐาน (ไม่มียอด/เบอร์)
  if ((e && e.code === '42501') || /row-level security|permission denied/i.test(m)) return 'ไม่มีสิทธิ์ทำรายการนี้';
  if (/p_prior_sessions/.test(m)) return 'ฐานข้อมูลยังไม่ได้รัน migration 065 (ช่อง "เรียนไปแล้วอีก — ไม่ทราบวัน") — แจ้งเจ้าของร้าน หรือเว้นช่องนี้เป็น 0';
  if (NO_TABLE.test(m)) return 'ยังไม่ได้ติดตั้งระบบคอร์สเรียนในฐานข้อมูล';
  return 'ฐานข้อมูลตอบกลับผิดปกติ' + (e && e.code ? ' (รหัส ' + e.code + ')' : '');
}
const uuid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random();

// ── สถานะ ──
function blank() {
  return { uid: null, tid: null, me: '', phase: 'boot', students: [], sess: [], reqs: [], notes: new Map(), loaded: false, missing: false, error: '',
           tab: 'students', q: '', tok: 0, rt: null, openId: null, det: null, add: null, flash: '', loginErr: '', loginBusy: false };
}
let st = blank();
let channel = null, hiddenAt = 0;

const $app = document.getElementById('app');
const sessOf = id => st.sess.filter(s => s.enrollment_id === id);
const stuOf = id => st.students.find(r => r.enrollment_id === id) || null;
const dispName = r => r.student_name + (r.nickname ? ' (' + r.nickname + ')' : '');
const sessKey = s => s.starts_at || (s.held_on ? s.held_on + 'T00:00:00+07:00' : '');

// ── เข้าสู่ระบบ ──
async function onSession(session) {
  const uid = session && session.user ? session.user.id : null;
  if (uid && uid === st.uid && st.phase !== 'login') return;
  reset();
  if (!uid) { st.phase = 'login'; render(); return; }
  st.uid = uid;
  st.phase = 'check';
  render();
  const { data, error } = await db.rpc('my_teacher_id');
  if (uid !== st.uid) return;
  if (error) {
    console.error('[Teacher me]', error.code || '');
    if (NO_TABLE.test(error.message || '')) st.missing = true; else showFatalError('ตรวจสิทธิ์ครูไม่สำเร็จ: ' + errText(error));
    st.phase = 'notTeacher';
    render();
    return;
  }
  if (!data) { st.phase = 'notTeacher'; render(); return; }
  st.tid = data;
  st.phase = 'main';
  render();
  loadAll();
  subscribe();
}
function reset() {
  clearTimeout(st.rt);
  if (channel) { try { db.removeChannel(channel); } catch (e) { /* ช่องปิดไปแล้ว */ } channel = null; }
  st = blank();
  document.getElementById('who').textContent = '';
  document.getElementById('logoutBtn').hidden = true;
  document.getElementById('profileLink').hidden = true;
  $app.innerHTML = '';
}

// ── โหลด ──
async function loadAll() {
  if (!st.uid || !st.tid) return;
  const uid = st.uid, tok = ++st.tok;
  const [ms, cs, rq, me] = await Promise.all([
    db.rpc('teach_my_students'),
    db.from('class_sessions').select('id, enrollment_id, teacher_id, status, starts_at, ends_at, held_on, hours, room, cancel_by, late_cancel, cancel_reason, gcal_uid, gcal_start').order('starts_at', { ascending: true }).limit(1000),
    db.from('enrollment_extension_requests').select('id, enrollment_id, requested_until, reason, status, decision_note, approved_until, created_at').order('created_at', { ascending: false }),
    db.from('teachers').select('display_name').eq('id', st.tid),
  ]);
  if (uid !== st.uid || tok !== st.tok) return;                       // สลับบัญชี/ออกจากระบบ/โหลดซ้อน — ทิ้งผล
  st.loaded = true;
  const bad = ms.error || cs.error || rq.error;
  if (bad) {
    console.error('[Teacher load]', bad.code || '');
    st.students = []; st.sess = []; st.reqs = [];
    st.missing = NO_TABLE.test(bad.message || '');
    st.error = st.missing ? '' : 'โหลดข้อมูลไม่สำเร็จ: ' + errText(bad);
    if (st.error) showFatalError(st.error);

    st.missing = false; st.error = '';

    st.sess = cs.data || [];

  if (!me.error && me.data && me.data[0]) st.me = me.data[0].display_name || '';
  document.getElementById('who').textContent = st.me ? 'ครู ' + st.me : '';
  document.getElementById('logoutBtn').hidden = false;
  document.getElementById('profileLink').hidden = false;          // หน้าโปรไฟล์ครูบนเว็บ (068) — เฉพาะผู้ที่ my_teacher_id ไม่ว่าง (หน้านี้เปิดได้เฉพาะครูอยู่แล้ว)
  if (st.det) await loadNotes(st.det.id, true);

async function loadNotes(eid, silent) {
  const d = st.det;
  if (!d || d.id !== eid) return;
  const ids = sessOf(eid).map(s => s.id);
  if (!ids.length) { d.notesLoaded = true; return; }
  const uid = st.uid;
  const { data, error } = await db.from('session_notes').select('session_id, note').in('session_id', ids);
  if (uid !== st.uid || st.det !== d) return;
  if (error) { console.error('[Teacher notes]', error.code || ''); d.err = 'โหลดบันทึกการสอนไม่สำเร็จ: ' + errText(error); }
  else { ids.forEach(i => st.notes.delete(i)); (data || []).forEach(n => st.notes.set(n.session_id, n.note)); }
  d.notesLoaded = true;
  if (!silent) render();
}
function scheduleReload() {
  if (!st.uid || !st.loaded) return;
  clearTimeout(st.rt);
  st.rt = setTimeout(() => { st.rt = null; loadAll(); }, 400);
}
function subscribe() {
  try {
    const rtWatch = () => (status) => { if (status === 'SUBSCRIBED') scheduleReload(); };
    channel = db.channel('teacher-page');
    ['class_sessions', 'enrollments', 'enrollment_extension_requests'].forEach(t => {
      channel = channel.on('postgres_changes', { event: '*', schema: 'public', table: t }, scheduleReload);
    });
    channel.subscribe(rtWatch());
  } catch (e) { console.error('[Teacher rt]', e && e.code || ''); }
}
document.addEventListener('visibilitychange', () => {

});

async function callFn(name, body) {
  let data, error;
  try { ({ data, error } = await db.functions.invoke(name, { body })); } catch (err) { return { error: { code: 'network', message: String(err && err.message || err) } }; }
  if (!error) return data || {};
  let payload = null;
  try { payload = error.context && typeof error.context.json === 'function' ? await error.context.json() : null; } catch (e) { /* ไม่ใช่ JSON */ }
  if (payload && payload.error) return payload;
  if (error.context && error.context.status === 404) return { error: { code: 'not_configured', message: 'ยังไม่ได้ติดตั้งฟังก์ชัน ' + name } };
  return { error: { code: 'network', message: error.message || String(error) } };
}

// เรียก gcal-sync · ready=false เมื่อยังไม่ติดตั้ง/ตั้งค่า/ติดต่อไม่ได้ → ถอยกลับลงฐานอย่างเดียวตามเดิม (ไม่ขวางการนัดสอน)
async function cal(body) {

  const m = s.match(/^\[([^\]]{1,40})\]\s*/);

function render() {

  if (st.phase === 'check' || st.phase === 'boot') { $app.innerHTML = '<div class="empty">กำลังตรวจสอบสิทธิ์…</div>'; return; }

  if (!st.loaded) { $app.innerHTML = '<div class="empty">กำลังโหลดข้อมูลนักเรียน…</div>'; return; }
  const act = document.activeElement;

  const y = window.scrollY;
  $app.innerHTML = mainHtml();
  if (keep) {
    const el = document.getElementById(keep.id);

function openForm(k, sid) {
  const d = st.det, s = sid ? sessOf(d.id).find(x => x.id === sid) : null, today = todayBkk();
  d.open = k; d.err = ''; d.ok = ''; d.warn = []; d.fv = { sid: sid || '' };

function failMsg(msg) { const d = st.det; d.err = msg; d.ok = ''; d.warn = []; render(); }
async function run(label, fn) {
  const d = st.det;
  if (!d || d.busy) return;
  const uid = st.uid;
  d.busy = label; d.err = ''; d.ok = ''; d.warn = [];
  render();
  try {
    const res = await fn();
    if (uid !== st.uid || st.det !== d) return;
    d.busy = ''; d.ok = (res && res.ok) || ''; d.warn = (res && res.warn) || []; d.open = null; d.fv = {}; d.link = null;
    render();
    loadAll();
  } catch (e) {
    if (uid !== st.uid || st.det !== d) return;
    console.error('[Teacher action]', label, e && e.code || '');
    d.busy = ''; d.err = e instanceof CalBlock ? e.message : 'ไม่สำเร็จ: ' + errText(e);
    render();
  }
}
const rpc = async (fn, args) => { const { data, error } = await db.rpc(fn, args); if (error) throw error; return data; };
const ts = (ymd, hm) => ymd + 'T' + hm + ':00+07:00';

function submit(k) {
  const d = st.det, fv = d.fv, today = todayBkk();

    const h = num(fv.hours);
    if (!fv.date) return failMsg('ใส่วันที่สอน');
    if (fv.date > today) return failMsg('วันที่สอนต้องไม่เกินวันนี้');
    if (h !== null && (Number.isNaN(h) || h <= 0 || h > 12)) return failMsg('ชั่วโมงต้องมากกว่า 0 และไม่เกิน 12');
    return run('done', async () => { await rpc('teach_session_done', { p_session: fv.sid, p_held_on: fv.date, p_hours: h }); return { ok: 'ทำเครื่องหมายสอนแล้ว ✓' }; });
  }
  if (k === 'cancel') {
    if (fv.as === 'cancelled' && fv.by === 'student' && !fv.notified) return failMsg('ใส่วันที่นักเรียนแจ้ง');
    if (fv.as === 'cancelled' && fv.by === 'student' && fv.notified > today) return failMsg('วันที่แจ้งต้องไม่เกินวันนี้');
    if (String(fv.reason).length > 300) return failMsg('เหตุผลยาวเกิน 300 ตัวอักษร');

        else if (!rm.ok && rm.ready) warn.push('ยกเลิกรอบแล้ว แต่ลบนัดในปฏิทินไม่สำเร็จ — ' + calMsg(rm) + ' — กดปุ่ม "ลบนัดในปฏิทิน" ที่รอบนี้เพื่อลองอีกครั้ง');
        else if (!rm.ok) warn.push('ยกเลิกรอบแล้ว แต่ยังลบนัดในปฏิทินให้ไม่ได้ (ระบบปฏิทินยังไม่พร้อม) — ลบเองในปฏิทิน');

      }
      const res = await rpc('teach_session_schedule', { p_enrollment: d.id, p_teacher: st.tid, p_starts: startsTs, p_ends: endsTs, p_room: room || null, p_hours: null });
      const warn = ((res && res.warnings) || []).map(w => WARN_TXT[w] || ('คำเตือนจากระบบ (รหัส ' + String(w).slice(0, 40) + ')'));
      let okMsg = 'นัดรอบเรียนแล้ว ✓';
      // 2) ลง Calendar ให้ (event id คงที่ — กดซ้ำไม่ซ้ำ) · ล้ม = แดงตัวหนา + ปุ่ม "ลงปฏิทิน" ที่รอบนั้น (ห้ามเงียบ)
      if (room && !ready) warn.push('บันทึกนัดแล้ว แต่ยังไม่ได้ลงปฏิทิน — ระบบปฏิทินยังไม่พร้อม (ยังไม่ได้ตั้งค่า/ติดต่อไม่ได้) · ลงปฏิทินเองหรือกด "ลงปฏิทิน" ที่รอบนี้ภายหลัง');
      else if (room) {
        const up = await cal({ action: 'upsert', session_id: res && res.id });
        if (up.ok) okMsg += ' · ลงปฏิทินแล้ว ✓';
        else warn.push('นัดบันทึกแล้ว แต่ลงปฏิทินไม่สำเร็จ — ' + calMsg(up) + ' — กดปุ่ม "ลงปฏิทิน" ที่รอบนี้เพื่อลองอีกครั้ง');
      }
      return { ok: okMsg, warn };
    });
  }
  if (k === 'ext') {
    const r = stuOf(d.id);
    if (!fv.until) return failMsg('ใส่วันที่ที่ขอขยายถึง');
    if (!String(fv.reason).trim()) return failMsg('ใส่เหตุผลที่ขอขยายอายุ');
    if (String(fv.reason).length > 500) return failMsg('เหตุผลยาวเกิน 500 ตัวอักษร');
    if (r && r.effective_expiry && fv.until <= r.effective_expiry) return failMsg('วันที่ขอต้องเกินวันหมดอายุปัจจุบัน');
    return run('ext', async () => { await rpc('teach_extend_request', { p_enrollment: d.id, p_until: fv.until, p_reason: String(fv.reason).trim() }); return { ok: 'ส่งคำขอขยายอายุแล้ว — รอเจ้าของร้านตัดสิน' }; });
  }
}

// ── ตัวฟังเหตุการณ์ (ตัวเดียวที่ #app) ──
$app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b) {
    const d = st.det, a = b.dataset.act;
    if (a === 'back') { st.det = null; render(); return; }
    if (a.startsWith('add-')) { addAct(a, b); return; }
    if (!d || d.busy) return;
    if (a === 'open') openForm(b.dataset.k, b.dataset.sid || '');
    else if (a === 'close-form') { d.open = null; d.fv = {}; d.err = ''; d.link = null; render(); }
    else if (a === 'submit') submit(b.dataset.k);
    else if (a === 'cal-sync' || a === 'cal-remove') {
      const sid = b.dataset.sid, rmv = a === 'cal-remove';
      run(a, async () => {
        const r = await cal({ action: rmv ? 'remove' : 'upsert', session_id: sid });
        if (!r.ok) throw new CalBlock(r.ready ? calMsg(r) : 'ระบบปฏิทินยังไม่พร้อม (ยังไม่ได้ตั้งค่า/ติดต่อไม่ได้) — ลองใหม่ภายหลัง');
        if (rmv) return r.res.removed ? { ok: 'ลบนัดในปฏิทินแล้ว ✓' } : { ok: 'ไม่มีนัดที่ระบบสร้างให้ลบ', warn: r.res.message ? [r.res.message] : [] };
        return { ok: r.res.created === false ? (r.res.message || 'รอบนี้ผูกกับนัดในปฏิทินอยู่แล้ว') : 'ลงปฏิทินแล้ว ✓' };
      });
    }
    else if (a === 'unlink') { const sid = b.dataset.sid; run('unlink', async () => { await rpc('teach_gcal_unlink', { p_session: sid }); return { ok: 'ถอดนัดปฏิทินแล้ว' }; }); }
    else if (a === 'link-pick') {
      const s = sessOf(d.id).find(x => x.id === d.fv.sid), x = s && d.link ? linkChoices(s, d.link)[Number(b.dataset.i)] : null;
      if (x) run('link', async () => { await rpc('teach_gcal_link', { p_session: s.id, p_uid: x.ev.uid, p_start: x.ev.start + ':00+07:00' }); return { ok: 'ผูกนัดปฏิทินแล้ว ✓' }; });
    }
    return;
  }
  const tab = e.target.closest('#tabs [data-tab]');
  if (tab) { st.tab = tab.dataset.tab; render(); return; }
  if (e.target.closest('#reload')) { loadAll(); return; }
  const card = e.target.closest('.card.click[data-eid]');
  if (card && !st.det) openStudent(card.dataset.eid, card.dataset.sid || '');
});
$app.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.card.click[data-eid]') && !st.det) { e.preventDefault(); openStudent(e.target.dataset.eid, e.target.dataset.sid || ''); }
  if (e.key === 'Enter' && e.target.id === 'a_phone' && st.add && !st.add.busy) { e.preventDefault(); addFind(); }
});
$app.addEventListener('input', e => {
  const t = e.target;
  if (st.add && t.dataset.ad !== undefined) { st.add.dates[Number(t.dataset.ad)] = t.value; return; }          // วันที่เรียนไปแล้ว (ไม่วาดใหม่ระหว่างพิมพ์)
  if (st.add && t.dataset.a) { st.add[t.dataset.a] = t.value; return; }
  if (t.id === 'q') { st.q = t.value; const pos = t.selectionStart; render(); const q = document.getElementById('q'); if (q) { q.focus(); try { q.setSelectionRange(pos, pos); } catch (x) { /* search input */ } } return; }
  if (!st.det || !t.dataset.f) return;
  st.det.fv[t.dataset.f] = t.type === 'checkbox' ? t.checked : t.value;
  if (st.det.open === 'cancel' && t.dataset.f === 'notified') {      // ตัวอย่างผลแจ้งช้า: แก้เฉพาะกล่องข้อความ ไม่วาดทั้งหน้า (กันปุ่มหายตอนกดระหว่างโฟกัสช่อง)
    const s = sessOf(st.det.id).find(x => x.id === st.det.fv.sid), pv = document.getElementById('cancelPrev');
    if (s && pv) pv.innerHTML = cancelPreview(s, st.det.fv);
  }
});
$app.addEventListener('change', e => {
  const t = e.target;
  if (st.add && t.dataset.ab) { st.add[t.dataset.ab] = t.checked; render(); return; }                          // สวิตช์ย้อนหลัง · ติ๊กชำระครบ
  if (st.add && t.dataset.ad !== undefined) { st.add.dates[Number(t.dataset.ad)] = t.value; return; }
  if (st.add && t.dataset.a) { st.add[t.dataset.a] = t.value; if (t.dataset.a === 'course' || t.dataset.a === 'prior' || t.dataset.a === 'started') render(); return; }
  if (!st.det || !t.dataset.f) return;
  st.det.fv[t.dataset.f] = t.value;
  if (t.dataset.struct) render();                                      // เลือกตัวเลือกที่ทำให้ฟอร์มเปลี่ยนรูป (ยกเลิก/ไม่มา · ใครยกเลิก)
});
$app.addEventListener('submit', async e => {
  if (e.target.id !== 'loginForm') return;
  e.preventDefault();
  if (st.loginBusy) return;
  const email = document.getElementById('lgEmail').value.trim(), password = document.getElementById('lgPass').value;
  if (!email || !password) return;
  st.loginBusy = true; st.loginErr = ''; render();
  document.getElementById('lgEmail').value = email;
  const { error } = await db.auth.signInWithPassword({ email, password });
  st.loginBusy = false;
  if (error) { st.loginErr = 'เข้าสู่ระบบไม่สำเร็จ — ตรวจอีเมลและรหัสผ่านอีกครั้ง'; render(); }
});
document.getElementById('logoutBtn').addEventListener('click', async () => {
  const uid = st.uid;
  await db.auth.signOut();
  if (uid === st.uid) { reset(); st.phase = 'login'; render(); }
});

db.auth.onAuthStateChange((event, session) => {
  if (event === 'TOKEN_REFRESHED') return;
  setTimeout(() => onSession(event === 'SIGNED_OUT' ? null : session), 0);   // ไม่เรียกฐานข้อมูลในตัวฟังโดยตรง (กันค้างตอนสลับ session)
});
(async () => {
  const { data } = await db.auth.getSession();
  await onSession(data && data.session);
})();
</script>
